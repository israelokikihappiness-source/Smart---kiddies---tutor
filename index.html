

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Kiddies - Kindergarten Final Fixed</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial;background:#fef9e7;padding:12px}
.header{background:linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#1dd1a1);padding:18px;border-radius:18px;text-align:center;color:#fff}
.card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
@media(min-width:600px){.card-grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:16px;padding:20px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.08);cursor:pointer;min-height:150px;display:flex;flex-direction:column;justify-content:center;font-size:16.5px;font-weight:600}
.card.happiness{background:linear-gradient(135deg,#ff9a9e,#fecfef);border:3px solid gold}
.q-box{background:#fff;border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.opt{border:2px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}
.opt.sel{background:#dbeafe;border-color:#3b82f6}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:13px;border-radius:12px;border:none;font-weight:700;cursor:pointer}
.btn-dash{background:#e5e7eb} .btn-exit{background:#fee2e2;color:#b91c1c} .btn-next{background:#22c55e;color:#fff}
.result{background:#fff;border:3px solid #86efac;border-radius:18px;padding:20px;text-align:center;margin-top:14px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="header"><h2> Smart Kiddies Tutor</h2><div>Kindergarten - Primary 1 - Happiness BRAVO!</div></div>

<div id="dashboard">
<div class="card-grid">
<div class="card happiness">BRAVO!<br>Happiness<br> Kindergarten</div>
<div class="card" onclick="startPractice()"> Practice<br>5 Qs</div>
<div class="card" onclick="startAssessment()"> Assessment<br>45 Qs</div>
<div class="card"> History</div>
</div>
</div>

<div id="quiz" class="hidden">
<div class="q-box">
<div style="display:flex;justify-content:space-between"><span id="badge" style="background:#dcfce7;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700">PRACTICE</span><span id="qcount">1/5</span></div>
<h3 id="qtext"></h3><div id="opts"></div>
<div class="btn-row"><button class="btn btn-dash" onclick="goDash()"> Dashboard</button><button class="btn btn-exit" onclick="goDash()"> Exit</button></div>
<div class="btn-row"><button class="btn btn-next" onclick="nextQ()">Next →</button></div>
</div>
</div>

<div id="result" class="hidden"></div>

<script>
const POOL=[]; for(let i=1;i<=50;i++){ let b=(i%9)+1; let ans=i+b; let opts=[ans,ans-1,ans+1,ans+2].sort(()=>Math.random()-0.5); POOL.push({q:`${i} + ${b} = ?`,options:opts,correct:ans,exp:`${i}+${b}=${ans}`}); }
POOL[0]={q:'Opposite of BIG?',options:['Small','Big','Tiny','Large'],correct:'Small',exp:'Opposites'};
POOL[1]={q:'Cat:kitten :: Dog:___',options:['Puppy','Kitten','Dog','Cat'],correct:'Puppy',exp:'Baby dog is puppy'};
POOL[2]={q:'After B?',options:['A','C','D','E'],correct:'C',exp:'ABC'};
POOL[3]={q:'Odd: Apple,Banana,Car,Mango',options:['Car','Apple','Banana','Mango'],correct:'Car',exp:'Car not fruit'};
POOL[4]={q:'I ___ a book yesterday',options:['read','reads','reading','readed'],correct:'read',exp:'Past tense'};
let mode='practice',qs=[],idx=0,score=0,answers=[];
function startPractice(){mode='practice';qs=POOL.slice(0,5);init();}
function startAssessment(){mode='assessment';qs=POOL.slice(5,50);init();}
function init(){idx=0;score=0;answers=[];document.getElementById('dashboard').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');showQ();}
function showQ(){const cur=qs[idx];document.getElementById('badge').innerText=mode==='practice'?'PRACTICE - 5Qs':'ASSESSMENT - 45Qs';document.getElementById('qcount').innerText=(idx+1)+'/'+qs.length;document.getElementById('qtext').innerText=(idx+1)+'. '+cur.q;const od=document.getElementById('opts');od.innerHTML='';cur.options.forEach((op,i)=>{const d=document.createElement('div');d.className='opt';d.innerText=String.fromCharCode(65+i)+'. '+op;d.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');d.dataset.val=op;};od.appendChild(d);});}
function nextQ(){const sel=document.querySelector('.opt.sel');if(!sel){alert('Pick answer');return;}let val=sel.dataset.val;if(!isNaN(val)) val=parseInt(val);const cur=qs[idx];const ok=val==cur.correct;if(ok) score++;answers.push({q:cur.q,yours:val,correct:cur.correct,ok,exp:cur.exp});idx++;if(idx<qs.length) showQ();else finish();}
function finish(){document.getElementById('quiz').classList.add('hidden');const perc=Math.round(score/qs.length*100);let title=perc>=80?'Excellent Joy!':'Good Job Joy!';let html=`<div class="result"><h2>${title}</h2><h1 style="color:#f97316;font-size:42px">${perc}% (${score}/${qs.length})</h1><p>Kindergarten - verbal - ${mode}</p>`;if(mode==='practice'){html+=`<div class="btn-row"><button class="btn btn-dash" onclick="goDash()">Dashboard</button><button class="btn" style="background:#f97316;color:#fff" onclick="startAssessment()">Assessment</button></div>`;}else{html+=`<div class="btn-row"><button class="btn btn-dash" onclick="goDash()">Dashboard</button><button class="btn btn-exit" onclick="goDash()">Exit</button></div>`;}html+=`<h3 style="text-align:left">Review All Questions</h3>`;answers.forEach((a,i)=>{html+=`<div style="text-align:left;padding:10px;border-left:5px solid ${a.ok?'#22c55e':'#ef4444'};background:${a.ok?'#dcfce7':'#fee2e2'};border-radius:10px;margin:8px 0"><b>${i+1}. ${a.q}</b><br>You:${a.yours} Correct:${a.correct}<br><small>${a.exp}</small></div>`;});html+=`</div>`;const r=document.getElementById('result');r.innerHTML=html;r.classList.remove('hidden');}
function goDash(){document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');}
</script>
</body>
</html>
