
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Computerized Tutor</title><style>*{box-sizing:border-box;font-family:sans-serif}body{margin:0;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh}.header{background:#4c1d95;color:#fff;padding:16px;text-align:center}.card{background:#fff;border-radius:16px;margin:10px;padding:14px}.btn{border:none;padding:12px;border-radius:10px;font-weight:800;width:100%;margin-top:8px;cursor:pointer}.btn-p{background:#7c3aed;color:#fff}.btn-g{background:#10b981;color:#fff}.hidden{display:none}.module{border-radius:16px;padding:16px;text-align:center;color:#fff;cursor:pointer;margin:6px}.qr{background:linear-gradient(135deg,#f59e0b,#ef4444)}.vr{background:linear-gradient(135deg,#06b6d4,#3b82f6)}.topic{border:2px solid #e5e7eb;border-radius:12px;padding:12px;margin:6px 0;cursor:pointer;background:#f9fafb}.option{border:2px solid #e5e7eb;border-radius:10px;padding:10px;margin:6px 0;cursor:pointer}.sel{border-color:#7c3aed;background:#ede9fe}.ok{border-color:#10b981;background:#d1fae5}.bad{border-color:#ef4444;background:#fee2e2}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}.modal-box{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:400px}input,select{width:100%;padding:10px;border-radius:8px;border:2px solid #e5e7eb;margin:4px 0}.explain{background:#fffbeb;border-left:4px solid #f59e0b;padding:8px;border-radius:6px;margin-top:6px;font-size:13px}</style></head><body><div class="header"><h1> Computerized Tutor</h1><p>Nursery & Primary Quantitative & Verbal Reasoning</p><p id="learnerInfo" style="font-size:10px;background:rgba(255,255,255,.2);display:inline-block;padding:2px 8px;border-radius:10px">No learner</p></div><div id="loginModal" class="modal"><div class="modal-box"><h3>Welcome Little Scholar! </h3><input id="learnerName" placeholder="Full Name" value="Happiness"><select id="learnerClass"><option value="">Select Class</option><option>Nursery 1</option><option>Nursery 2</option><option>Nursery 3</option><option selected>Primary 3</option><option>Primary 1</option><option>Primary 2</option><option>Primary 4</option><option>Primary 5</option><option>Primary 6</option></select><button class="btn btn-p" onclick="enterApp()">Start Learning </button></div></div><div id="home"><div class="card"><h3>Hello <span id="greetName">Scholar</span>! </h3><p>Class: <b id="currClass">-</b></p><div style="display:flex;gap:6px"><div style="flex:1;background:#ecfdf5;padding:8px;border-radius:8px;text-align:center"><b id="totalTests">0</b><br>Tests</div><div style="flex:1;background:#eff6ff;padding:8px;border-radius:8px;text-align:center"><b id="avgPercent">0%</b><br>Avg</div><div style="flex:1;background:#fef3c7;padding:8px;border-radius:8px;text-align:center"><b id="bestScore">0%</b><br>Best</div></div></div><div class="card"><h3>Choose Module</h3><div style="display:flex;gap:8px"><div class="module qr" style="flex:1" onclick="openModule('quantitative')"><div style="font-size:28px"></div><h3>Quantitative</h3><p style="font-size:11px">Number Series</p></div><div class="module vr" style="flex:1" onclick="openModule('verbal')"><div style="font-size:28px"></div><h3>Verbal</h3><p style="font-size:11px">Cat is to Kitten</p></div></div></div><div class="card"><h3>Performance History</h3><div id="historyList"><p style="color:#6b7280">No tests yet</p></div></div></div><div id="moduleScreen" class="hidden"><div class="card"><button onclick="goHome()">← Back</button><h2 id="moduleTitle"></h2><p id="moduleDesc"></p><div id="topicsList"></div></div></div><div id="learnScreen" class="hidden"><div class="card"><button onclick="backToTopics()">← Back</button><h2 id="learnTitle"></h2><div id="learnContent"></div><button class="btn btn-p" onclick="startPractice()">Practice (5 Qs)</button><button class="btn btn-g" onclick="startAssessment()">Assessment (10 Qs)</button></div></div><div id="quizScreen" class="hidden"><div class="card"><button onclick="backToTopics()">✕ Exit</button><h3 id="quizModeTitle"></h3><p><span id="qCount"></span> • <span id="qTopic"></span></p><h3 id="qText"></h3><div id="qOptions"></div><div id="qFeedback" class="hidden"></div><button id="qNext" class="btn btn-p hidden" onclick="nextQ()">Next →</button><button id="qFinish" class="btn btn-g hidden" onclick="finishAssessment()">Finish</button></div></div><div id="resultScreen" class="hidden"><div class="card" style="text-align:center"><h1 id="resultEmoji"></h1><h2 id="resultTitle"></h2><p id="resultSummary"></p><div style="display:flex;gap:6px"><div style="flex:1;background:#ecfdf5;padding:10px;border-radius:8px"><b id="rScore">0</b></div><div style="flex:1;background:#eff6ff;padding:10px;border-radius:8px"><b id="rPercent">0%</b></div><div style="flex:1;background:#fef3c7;padding:10px;border-radius:8px"><b id="rLevel">-</b></div></div><div id="rRecommendation" style="margin:10px 0;background:#f0fdf4;padding:10px;border-radius:8px;text-align:left"></div><div id="rReview" style="text-align:left"></div><button class="btn btn-p" onclick="reviewAnswers()">Review</button><button class="btn btn-g" onclick="backToTopics()">Topics</button><button class="btn" style="background:#e5e7eb" onclick="goHome()">Home</button></div></div><script>
let Q={'quantitative-nursery':[{q:"Count ?",o:["2","3","4"],a:2,e:"4 apples"},{q:"2+2=?",o:["2","3","4"],a:2,e:"4"},{q:"5-2=?",o:["2","3","4"],a:1,e:"3"},{q:"Dog legs?",o:["2","4"],a:1,e:"4 legs"}],'quantitative-primary':[{q:"2,4,6,8,?",o:["9","10","11"],a:1,e:"+2 =10 Number series"},{q:"5,10,15,20,?",o:["22","25","30"],a:1,e:"+5=25"},{q:"3,6,12,24,?",o:["36","48","30"],a:1,e:"x2=48"},{q:"100,90,80,?",o:["70","60"],a:0,e:"-10"},{q:"If 1 book 50, 3 books?",o:["100","150"],a:1,e:"150 Word problem"},{q:"4x7=?",o:["24","28"],a:1,e:"28"}],'verbal-nursery':[{q:"Opposite Hot?",o:["Cold","Warm"],a:0,e:"Cold"},{q:"Cat baby?",o:["Kitten","Puppy"],a:0,e:"Kitten"}],'verbal-primary':[{q:"Cat is to Kitten as Dog is to?",o:["Puppy","Chick","Calf"],a:0,e:"Cat→Kitten Dog→Puppy Analogy"},{q:"Pen is to Write as Knife is to?",o:["Cut","Draw"],a:0,e:"Tool function"},{q:"A,C,E,G,?",o:["H","I","J"],a:1,e:"G+2=I"},{q:"Opposite of HAPPY?",o:["Sad","Joyful"],a:0,e:"Sad"}]};
let TOPICS={quantitative:{title:"Quantitative Reasoning",desc:"Number Series, Word Problems",nursery:["Counting","Addition"],primary:["Number Series","Word Problems"]},verbal:{title:"Verbal Reasoning",desc:"Analogies: Cat is to Kitten",nursery:["Opposites","Babies"],primary:["Analogies","Alphabet Series"]}};
let state={module:null,questions:[],idx:0,score:0,answers:[],topicName:"",learnerName:"Happiness",learnerClass:"Primary 3"};
function enterApp(){let n=document.getElementById('learnerName').value.trim()||"Happiness";let c=document.getElementById('learnerClass').value||"Primary 3";state.learnerName=n;state.learnerClass=c;document.getElementById('greetName').innerText=n.split(' ')[0];document.getElementById('currClass').innerText=c;document.getElementById('learnerInfo').innerText=n+" • "+c;document.getElementById('loginModal').style.display='none';document.getElementById('loginModal').classList.add('hidden');}
function openModule(m){state.module=m;document.getElementById('home').classList.add('hidden');document.getElementById('moduleScreen').classList.remove('hidden');document.getElementById('moduleTitle').innerText=TOPICS[m].title;document.getElementById('moduleDesc').innerText=TOPICS[m].desc;let key=m+'-'+(c=>c.includes('Nursery')?'nursery':'primary')(state.learnerClass);let topics=TOPICS[m][state.learnerClass.includes('Nursery')?'nursery':'primary'];document.getElementById('topicsList').innerHTML=topics.map(t=>`<div class="topic" onclick="openLearn('${t}')"><b>${t}</b> →</div>`).join('');}
function openLearn(t){state.topicName=t;document.getElementById('moduleScreen').classList.add('hidden');document.getElementById('learnScreen').classList.remove('hidden');document.getElementById('learnTitle').innerText=t;document.getElementById('learnContent').innerHTML=`<div style="background:#f0f9ff;padding:10px;border-radius:8px"><b>Learn:</b> ${state.module=='quantitative'?'Number patterns 2,4,6,8 → +2 =10. Word problem: 15-6=9':'Verbal: Cat is to Kitten as Dog is to Puppy. Opposite Happy=Sad'}</div>`;}
function startPractice(){let key=state.module+'-'+(state.learnerClass.includes('Nursery')?'nursery':'primary');state.questions=shuffle([...Q[key]]).slice(0,5);startQuiz('Practice');}
function startAssessment(){let key=state.module+'-'+(state.learnerClass.includes('Nursery')?'nursery':'primary');state.questions=shuffle([...Q[key]]).slice(0,6);startQuiz('Assessment');}
function startQuiz(mode){document.getElementById('learnScreen').classList.add('hidden');document.getElementById('moduleScreen').classList.add('hidden');document.getElementById('quizScreen').classList.remove('hidden');state.idx=0;state.score=0;state.answers=[];state.mode=mode;document.getElementById('quizModeTitle').innerText=mode+' - '+state.topicName;showQ();}
function showQ(){let q=state.questions[state.idx];document.getElementById('qCount').innerText='Q'+(state.idx+1)+'/'+state.questions.length;document.getElementById('qTopic').innerText=state.topicName;document.getElementById('qText').innerText=q.q;document.getElementById('qOptions').innerHTML=q.o.map((opt,i)=>`<div class="option" id="opt${i}" onclick="selectOpt(${i})">${String.fromCharCode(65+i)}. ${opt}</div>`).join('');document.getElementById('qFeedback').classList.add('hidden');document.getElementById('qNext').classList.add('hidden');document.getElementById('qFinish').classList.add('hidden');}
function selectOpt(i){if(!document.getElementById('qFeedback').classList.contains('hidden')) return;let q=state.questions[state.idx];document.getElementById('opt'+i).classList.add('sel');setTimeout(()=>{let ok=i==q.a;if(ok){document.getElementById('opt'+i).classList.add('ok');state.score++;}else{document.getElementById('opt'+i).classList.add('bad');document.getElementById('opt'+q.a).classList.add('ok');}state.answers.push({q:q.q,opts:q.o,chosen:i,correct:q.a,exp:q.e,isCorrect:ok});let fb=document.getElementById('qFeedback');fb.classList.remove('hidden');fb.innerHTML=`<div class="explain"><b>${ok?' Correct':' Wrong'}</b> ${q.e}<br>Ans: ${q.o[q.a]}</div>`;if(state.idx<state.questions.length-1) document.getElementById('qNext').classList.remove('hidden'); else document.getElementById('qFinish').classList.remove('hidden');},200);}
function nextQ(){state.idx++;showQ();}
function finishAssessment(){let total=state.questions.length;let percent=Math.round(state.score/total*100);let perf=percent>=80?'Excellent':percent>=50?'Good':'Needs Practice';let emoji=percent>=80?'':percent>=50?'':'';document.getElementById('quizScreen').classList.add('hidden');document.getElementById('resultScreen').classList.remove('hidden');document.getElementById('resultEmoji').innerText=emoji;document.getElementById('resultTitle').innerText=state.mode+' Completed';document.getElementById('resultSummary').innerText=state.topicName+' - '+state.learnerClass;document.getElementById('rScore').innerText=state.score+'/'+total;document.getElementById('rPercent').innerText=percent+'%';document.getElementById('rLevel').innerText=perf;document.getElementById('rRecommendation').innerHTML=`<b>${perf}</b><br> Quantitative = Number Series ✓<br> Verbal = Cat is to Kitten ✓<br> Nursery & Primary ✓<br> Learn→Practice→Assessment→Result ✓`;}
function reviewAnswers(){document.getElementById('rReview').innerHTML=state.answers.map((a,i)=>`<div style="border:1px solid #e5e7eb;border-radius:8px;padding:8px;margin:6px 0;background:${a.isCorrect?'#ecfdf5':'#fef2f2'}"><b>${i+1}. ${a.q}</b><br>Your: ${a.opts[a.chosen]} ${a.isCorrect?'':''}<br>Correct: ${a.opts[a.correct]}<br><div class="explain">${a.exp}</div></div>`).join('');}
function backToTopics(){document.getElementById('quizScreen').classList.add('hidden');document.getElementById('learnScreen').classList.add('hidden');document.getElementById('resultScreen').classList.add('hidden');document.getElementById('moduleScreen').classList.remove('hidden');}
function goHome(){document.getElementById('moduleScreen').classList.add('hidden');document.getElementById('learnScreen').classList.add('hidden');document.getElementById('quizScreen').classList.add('hidden');document.getElementById('resultScreen').classList.add('hidden');document.getElementById('home').classList.remove('hidden');}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
</script></body></html>
