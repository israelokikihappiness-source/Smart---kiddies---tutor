g homophone'},{q:'She __ buy a car yesterday',o:['buyed','bought','buy'],a:'bought',e:'Buy past bought'},{q:'Plural mouse?',o:['Mouses','Mice','Mouse'],a:'Mice',e:'mouse mice'}],'Primary 4':[{q:'What a beautiful day! type?',o:['Exclamatory','Interrogative','Declarative'],a:'Exclamatory',e:'Exclamation !'},{q:'He said I am tired indirect?',o:['He said he was tired','He said he is tired','He said I am tired'],a:'He said he was tired',e:'am -> was in past reporting'},{q:'Each of boys __ is/are',o:['is','are','were'],a:'is',e:'Each singular is'},{q:'He is a lion in battle?',o:['He is a lion','He is as brave','He runs like'],a:'He is a lion',e:'Metaphor says he IS lion'},{q:'unhappy prefix?',o:['un-','happy','-happy'],a:'un-',e:'un- prefix not'},{q:'If read present past?',o:['read red','readed','reading'],a:'read red',e:'Same spelling different pronunc past'},{q:'I stayed because it rained conj?',o:['because','stayed','rained'],a:'because',e:'because joins clauses'},{q:'Antonym victory?',o:['Win','Defeat','Success'],a:'Defeat',e:'Victory opposite defeat'},{q:'Neither John nor James __ is/are',o:['is','are','were'],a:'is',e:'Nearest James singular is'},{q:'Synonym abundant?',o:['Scarce','Plentiful','Small'],a:'Plentiful',e:'Abundant plentiful many'}],'Primary 5':[{q:'Boy broke window passive?',o:['Window was broken by boy','Boy was broken','Window broke boy'],a:'Window was broken by boy',e:'Object becomes subject passive'},{q:'Although it rained we went clause?',o:['Subordinate','Main','Phrase'],a:'Subordinate',e:'Depends on main subordinate'},{q:'Committee __ divided is/are',o:['is','are','was'],a:'are',e:'Members act individually are divided'},{q:'Wind whispered?',o:['Personification','Simile','Metaphor'],a:'Personification',e:'Giving human quality to wind'},{q:'You had studied would have passed cond?',o:['Second','Third','Zero'],a:'Third',e:'Past unreal third conditional'},{q:'Synonym meticulous?',o:['Careless','Careful','Quick'],a:'Careful',e:'Meticulous very careful' let selS=null,selM=null,curQ=[],idx=0,sc=0,ans=[],stud={};
function pickS(el){selS=el.dataset.s;document.querySelectorAll('[data-s]').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');}
function pickM(el){selM=el.dataset.m;document.querySelectorAll('[data-m]').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');}
function start(){let n=document.getElementById('name').value.trim();let c=document.getElementById('cls').value;let err=document.getElementById('err');if(!n){err.textContent='Enter name';return;}if(!c){err.textContent='Select class';return;}if(!selS){err.textContent='Select subject';return;}if(!selM){err.textContent='Select mode';return;}stud={name:n,cls:c,sub:selS,mode:selM};curQ=[...BANK[selS][c]].sort(()=>0.5-Math.random()).slice(0,10);idx=0;sc=0;ans=[];document.getElementById('setup').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');document.getElementById('mBadge').textContent=selM;document.getElementById('cBadge').textContent=c+' | '+selS;show();}
function show(){let q=curQ[idx];document.getElementById('qTxt').textContent=`Q${idx+1}: ${q.q}`;document.getElementById('pTxt').textContent=`${idx+1}/${curQ.length}`;document.getElementById('pBar').style.width=`${(idx+1)/curQ.length*100}%`;let opts=document.getElementById('opts');opts.innerHTML='';document.getElementById('feed').classList.add('hidden');document.getElementById('nBtn').classList.add('hidden');document.getElementById('fBtn').classList.add('hidden');q.o.forEach(o=>{let d=document.createElement('div');d.className='opt';d.textContent=o;d.onclick=()=>choose(o,d);opts.appendChild(d);});}
function choose(opt,el){let q=curQ[idx];let all=document.querySelectorAll('.opt');all.forEach(o=>o.style.pointerEvents='none');let correct=opt===q.a;if(correct)sc++;ans.push({q:q.q,sel:opt,cor:q.a,ok:correct,exp:q.e});if(stud.mode==='Practice'){all.forEach(o=>{if(o.textContent===q.a)o.classList.add('correct');else if(o===el&&!correct)o.classList.add('wrong');});let f=document.getElementById('feed');f.classList.remove('hidden');f.innerHTML=`<b>${correct?' Correct!':' Wrong'}</b> Answer: <b>${q.a}</b><div class='explain'> Tutor: ${q.e}</div>`;if(idx<curQ.length-1)document.getElementById('nBtn').classList.remove('hidden');else document.getElementById('fBtn').classList.remove('hidden');}else{el.style.background='#e0e7ff';el.style.borderColor='#4f46e5';if(idx<curQ.length-1)setTimeout(()=>{idx++;show();},500);else setTimeout(()=>finish(),500);}}
function nextQ(){idx++;show();}
function finish(){document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');let pct=Math.round(sc/curQ.length*100);document.getElementById('score').textContent=pct+'%';document.getElementById('sTxt').textContent=`${stud.name} (${stud.cls}) scored ${sc}/${curQ.length} in ${stud.sub} - ${stud.mode}`;let rev='';ans.forEach((a,i)=>{rev+=`<div style='background:#f8fafc;border-radius:10px;padding:12px;margin:8px 0;text-align:left'><b>Q${i+1}: ${a.q}</b><br>Your: <span style='color:${a.ok?'green':'red'}'>${a.sel} ${a.ok?'':''}</span><br>Correct: <b>${a.cor}</b><div class='explain'> ${a.exp}</div></div>`;});document.getElementById('review').innerHTML=rev;let h=JSON.parse(localStorage.getItem('kiddies_hist')||'[]');h.unshift({date:new Date().toLocaleString(),name:stud.name,cls:stud.cls,sub:stud.sub,mode:stud.mode,score:`${sc}/${curQ.length} (${pct}%)`,pct:pct});localStorage.setItem('kiddies_hist',JSON.stringify(h.slice(0,30)));}
function reset(){document.getElementById('result').classList.add('hidden');document.getElementById('hist').classList.add('hidden');document.getElementById('quiz').classList.add('hidden');document.getElementById('setup').classList.remove('hidden');document.getElementById('err').textContent='';}
function showH(){document.getElementById('setup').classList.add('hidden');document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('hist').classList.remove('hidden');let h=JSON.parse(localStorage.getItem('kiddies_hist')||'[]');let l=document.getElementById('hList');if(h.length===0){l.innerHTML='<p>No records yet. Complete a test to see real history.</p>';return;}l.innerHTML=h.map(x=>`<div style='border-bottom:1px solid #e2e8f0;padding:10px 0;display:flex;justify-content:space-between'><div><b>${x.name}</b> - ${x.cls}<br><small>${x.sub} | ${x.mode} | ${x.date}</small></div><div><b>${x.score}</b></div></div>`).join('');}
function clearH(){if(confirm('Clear history?')){localStorage.removeItem('kiddies_hist');showH();}}
</script></body></html>
