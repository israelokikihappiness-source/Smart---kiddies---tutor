<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Kiddies Tutor - Class Based</title>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:linear-gradient(135deg,#6a11cb,#2575fc);min-height:100vh}
.header{background:linear-gradient(90deg,#5a00d0,#7b2eff);color:white;padding:18px;text-align:center;font-size:26px;font-weight:800}
.card{background:white;border-radius:20px;margin:14px;padding:18px;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.subject{border:3px solid #00d084;border-radius:18px;padding:14px;margin:8px 0;text-align:center;font-weight:700;font-size:18px;cursor:pointer;background:linear-gradient(90deg,#d4fff0,#ffe6f5)}
.btn{background:#5a00d0;color:white;border:none;padding:14px 22px;border-radius:12px;font-size:17px;font-weight:700;width:100%;margin-top:10px;cursor:pointer}
.btn-green{background:#00c853}.btn-orange{background:#ff6f00}.btn-gray{background:#777}
.hidden{display:none}.option{border:2px solid #ddd;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;background:#fafafa}
.option.selected{border-color:#5a00d0;background:#ede7ff}.option.correct{border-color:#00c853;background:#d4ffd4}.option.wrong{border-color:#ff1744;background:#ffd4d4}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:100;padding:18px}
.modal-box{background:white;border-radius:20px;padding:22px;width:100%;max-width:420px}
input,select{width:100%;padding:13px;border-radius:10px;border:2px solid #ddd;font-size:16px;margin:6px 0}
.progress-bar{background:#eee;border-radius:20px;height:16px;overflow:hidden;margin:6px 0}
.progress-fill{background:linear-gradient(90deg,#00e676,#00c853);height:100%;transition:.5s}
</style></head><body>
<div class="header">Smart Kiddies Tutor</div>

<div id="classModal" class="modal"><div class="modal-box">
<h2 id="modalTitle">Welcome! </h2><p>Enter name and class:</p>
<input id="studentName" placeholder="Your Name"><select id="studentClass">
<option value="">-- Select Class --</option>
<option>Primary 1</option><option>Primary 2</option><option>Primary 3</option><option>Primary 4</option><option>Primary 5</option><option>Primary 6</option>
<option>JSS 1</option><option>JSS 2</option><option>JSS 3</option></select>
<button class="btn" onclick="saveClass()">Start / Switch Class </button>
</div></div>

<div id="homeScreen"><div class="card"><h2 id="greet">Hello</h2><p id="classInfo" style="font-weight:700;color:#5a00d0"></p>
<p>Current Class: <b id="currentClassBadge" style="background:#ede7ff;padding:6px 12px;border-radius:20px;color:#5a00d0">-</b></p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0"><div style="background:#e8f5e9;border-radius:12px;padding:10px;text-align:center"><b id="totalScore">0</b><br>Total Score</div><div style="background:#e3f2fd;border-radius:12px;padding:10px;text-align:center"><b id="avgScore">0%</b><br>Average</div></div>
<button class="btn btn-orange" onclick="openClassModal()"> Change to Another Class (e.g. Primary 3)</button></div>
<div class="card"><h2>Choose Subject - 25 Questions for <span id="classLabel">-</span></h2>
<div class="subject" onclick="startQuiz('English')"> English - <span id="prog-English">0%</span></div>
<div class="subject" onclick="startQuiz('Mathematics')"> Mathematics - <span id="prog-Mathematics">0%</span></div>
<div class="subject" onclick="startQuiz('Science')"> Science - <span id="prog-Science">0%</span></div>
<div class="subject" onclick="startQuiz('General Knowledge')"> General Knowledge - <span id="prog-General Knowledge">0%</span></div></div></div>

<div id="quizScreen" class="hidden"><div class="card"><h2 id="quizTitle">Question</h2>
<div class="progress-bar"><div id="qProgress" class="progress-fill"></div></div><p id="questionText" style="font-size:18px;font-weight:600"></p><div id="options"></div>
<button id="nextBtn" class="btn hidden" onclick="nextQuestion()">Next →</button><button id="finishBtn" class="btn btn-green hidden" onclick="finishQuiz()">Finish Quiz</button>
<button class="btn btn-gray" onclick="goHome()">Exit to Home</button></div></div>

<div id="resultScreen" class="hidden"><div class="card"><h2> Completed!</h2><p id="resultText"></p>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0"><div style="background:#e8f5e9;border-radius:12px;padding:10px;text-align:center"><b id="rScore">0/25</b><br>Score</div><div style="background:#e3f2fd;border-radius:12px;padding:10px;text-align:center"><b id="rPercent">0%</b><br>%</div><div style="background:#ffebee;border-radius:12px;padding:10px;text-align:center"><b id="rWrong">0</b><br>Wrong</div></div>
<button class="btn" id="reviewBtn" onclick="reviewWrong()"> Review Wrong Answers</button>
<button class="btn btn-green" onclick="goHome()"> Do Another Subject (Same Class)</button>
<button class="btn btn-orange" onclick="openClassModal()"> Switch to Another Class (e.g. Primary 3)</button></div>
<div id="reviewCard" class="card hidden"><h2>Wrong Answers Review</h2><div id="reviewList"></div><button class="btn btn-gray" onclick="document.getElementById('reviewCard').classList.add('hidden')">Close Review</button></div></div>

<script>
const BANK = {
"Primary 1": {"English":[{q:"What letter after A?",o:["B","C","D","Z"],a:0}], "Mathematics":[{q:"1+1=?",o:["1","2","3","4"],a:1}], "Science":[{q:"Sun gives?",o:["Light","Water","Sand","Stone"],a:0}], "General Knowledge":[{q:"Color of sky?",o:["Blue","Red","Green","Black"],a:0}]},
"Primary 3": {"English":[{q:"Opposite of Big?",o:["Small","Big","Large","Huge"],a:0}], "Mathematics":[{q:"5 x 2?",o:["10","5","7","2"],a:0}], "Science":[{q:"Plant needs?",o:["Sun","Moon","Car","House"],a:0}], "General Knowledge":[{q:"Capital Nigeria?",o:["Abuja","Lagos","Kano","Ibadan"],a:0}]},
"Primary 5": {"English":[{q:"What is noun?",o:["Naming word","Doing word","Describing","Joining"],a:0}], "Mathematics":[{q:"7 x 8?",o:["54","56","48","64"],a:1}], "Science":[{q:"Red Planet?",o:["Venus","Mars","Jupiter","Saturn"],a:1}], "General Knowledge":[{q:"Largest ocean?",o:["Atlantic","Pacific","Indian","Arctic"],a:1}]}
};

const DEFAULT_Q = {
"English":[{q:"What is opposite of 'happy'?",o:["Sad","Big","Fast","Hot"],a:0},{q:"Which is noun?",o:["Run","Beautiful","Dog","Quickly"],a:2},{q:"Choose correct spelling:",o:["Recieve","Receive","Receeve","Recive"],a:1},{q:"Plural of child?",o:["Childs","Children","Childes","Child"],a:1},{q:"She ___ to school",o:["go","goes","going","gone"],a:1},{q:"Verb means?",o:["Doing word","Naming word","Describing","Place"],a:0},{q:"Past of eat?",o:["Eated","Ate","Eaten","Eating"],a:1},{q:"Synonym big?",o:["Small","Large","Tiny","Little"],a:1},{q:"Adjective?",o:["Quickly","Happy","Run","Happiness"],a:1},{q:"Vowels?",o:["4","5","6","7"],a:1},{q:"Opposite begin?",o:["Start","End","Open","Close"],a:1},{q:"___ apple",o:["A","An","The","No"],a:1},{q:"Pronoun for John?",o:["She","He","It","They"],a:1},{q:"Correct: I __",o:["am","is","are","be"],a:0},{q:"Suffix helpful?",o:["Help","Ful","Helpful","Hel"],a:1},{q:"Prefix unhappy?",o:["Happy","Un","Unhappy","Ha"],a:1},{q:"Interrogative?",o:["Go away","What is your name?","She is nice","I like it"],a:1},{q:"Plural mouse?",o:["Mouses","Mice","Mouse","Mices"],a:1},{q:"Adverb?",o:["Describes verb","Names person","Joins","Shows action"],a:0},{q:"Opposite hot?",o:["Warm","Cold","Boiling","Heat"],a:1},{q:"Conjunction?",o:["And","Beautiful","Run","Quick"],a:0},{q:"What is your name?",o:[".","?","!",","],a:1},{q:"Synonym fast?",o:["Slow","Quick","Lazy","Late"],a:1},{q:"Antonym strong?",o:["Weak","Powerful","Mighty","Hard"],a:0},{q:"Correct spelling?",o:["Beutiful","Beautiful","Beatiful","Beautifull"],a:1}],
"Mathematics":[{q:"7 x 8?",o:["54","56","64","48"],a:1},{q:"100/4?",o:["20","25","30","40"],a:1},{q:"15+27?",o:["42","32","52","40"],a:0},{q:"50-19?",o:["31","29","30","41"],a:0},{q:"√64?",o:["6","7","8","9"],a:2},{q:"3²?",o:["6","9","3","12"],a:1},{q:"1/2+1/4?",o:["3/4","1/4","1/2","2/4"],a:0},{q:"12x12?",o:["124","144","132","142"],a:1},{q:"20% of 100?",o:["10","20","30","40"],a:1},{q:"Perimeter square 5?",o:["10","15","20","25"],a:2},{q:"9x9?",o:["72","81","90","99"],a:1},{q:"1000-1?",o:["999","1001","990","900"],a:0},{q:"6x7?",o:["42","36","48","49"],a:0},{q:"1/2 of 50?",o:["20","25","30","15"],a:1},{q:"8x5?",o:["35","40","45","30"],a:1},{q:"90/9?",o:["9","10","11","8"],a:1},{q:"11x11?",o:["111","121","131","122"],a:1},{q:"60+60?",o:["100","110","120","130"],a:2},{q:"3x15?",o:["35","40","45","50"],a:2},{q:"100/10?",o:["5","10","20","100"],a:1},{q:"2x2x2?",o:["4","6","8","10"],a:2},{q:"5²?",o:["10","20","25","30"],a:2},{q:"18/3?",o:["5","6","7","8"],a:1},{q:"4x9?",o:["32","34","36","38"],a:2},{q:"100-55?",o:["35","40","45","50"],a:2}],
"Science":[{q:"Red Planet?",o:["Venus","Mars","Jupiter","Saturn"],a:1},{q:"Spider legs?",o:["6","8","10","4"],a:1},{q:"Plants need?",o:["Sunlight","Moonlight","Darkness","Cold"],a:0},{q:"H2O?",o:["Salt","Water","Sugar","Oxygen"],a:1},{q:"Bones in body?",o:["106","206","306","156"],a:1},{q:"Breathe in?",o:["Carbon","Oxygen","Nitrogen","Helium"],a:1},{q:"Largest organ?",o:["Heart","Skin","Brain","Liver"],a:1},{q:"Mammal?",o:["Shark","Whale","Fish","Frog"],a:1},{q:"Day/night?",o:["Earth rotation","Moon rotation","Sun moves","Clouds"],a:0},{q:"Adult teeth?",o:["28","32","36","20"],a:1},{q:"Boiling water?",o:["50°C","100°C","0°C","150°C"],a:1},{q:"Renewable?",o:["Coal","Solar","Oil","Gas"],a:1},{q:"Makes food?",o:["Root","Leaf","Stem","Flower"],a:1},{q:"Heart chambers?",o:["2","3","4","5"],a:2},{q:"Gold symbol?",o:["Go","Au","Ag","Gd"],a:1},{q:"Bees collect?",o:["Water","Nectar","Sand","Leaves"],a:1},{q:"Closest to sun?",o:["Venus","Mercury","Earth","Mars"],a:1},{q:"Pulls down?",o:["Magnet","Gravity","Friction","Push"],a:1},{q:"Senses?",o:["4","5","6","7"],a:1},{q:"Hardest?",o:["Gold","Diamond","Iron","Wood"],a:1},{q:"Universal donor?",o:["A","B","O","AB"],a:2},{q:"Animals study?",o:["Botany","Zoology","Geology","Biology"],a:1},{q:"Earth orbit?",o:["30 days","365 days","7 days","24 hours"],a:1},{q:"Center atom?",o:["Electron","Nucleus","Proton","Shell"],a:1},{q:"Vitamin sun?",o:["Vitamin A","Vitamin C","Vitamin D","Vitamin B"],a:2}],
"General Knowledge":[{q:"Capital Nigeria?",o:["Lagos","Abuja","Kano","Ibadan"],a:1},{q:"Continents?",o:["5","6","7","8"],a:2},{q:"Largest ocean?",o:["Atlantic","Indian","Pacific","Arctic"],a:2},{q:"Bulb inventor?",o:["Newton","Edison","Einstein","Tesla"],a:1},{q:"Rainbow colors?",o:["6","7","8","5"],a:1},{q:"Nigeria animal?",o:["Lion","Eagle","Elephant","Horse"],a:1},{q:"Leap year days?",o:["365","366","364","367"],a:1},{q:"USA currency?",o:["Naira","Dollar","Pound","Euro"],a:1},{q:"Tallest mountain?",o:["K2","Everest","Kilimanjaro","Fuji"],a:1},{q:"Alphabet letters?",o:["24","26","28","25"],a:1},{q:"Largest continent?",o:["Africa","Asia","Europe","America"],a:1},{q:"Ghana capital?",o:["Accra","Lagos","Abidjan","Kumasi"],a:0},{q:"Nigeria states?",o:["30","36","32","38"],a:1},{q:"Fastest animal?",o:["Lion","Cheetah","Tiger","Leopard"],a:1},{q:"Largest desert?",o:["Sahara","Gobi","Kalahari","Arctic"],a:0},{q:"First moon man?",o:["Buzz Aldrin","Neil Armstrong","Yuri Gagarin","John Glenn"],a:1},{q:"Football players?",o:["9","10","11","12"],a:2},{q:"1st month?",o:["February","January","March","December"],a:1},{q:"Hours in day?",o:["12","24","48","20"],a:1},{q:"Not in Africa?",o:["Kenya","Brazil","Egypt","Nigeria"],a:1},{q:"Longest river?",o:["Niger","Nile","Amazon","Congo"],a:1},{q:"Triangle sides?",o:["3","4","5","6"],a:0},{q:"Nigeria flag?",o:["Green White Green","Red White Blue","Green Yellow Red","White Green White"],a:0},{q:"Minutes hour?",o:["30","60","90","100"],a:1},{q:"UK capital?",o:["Paris","London","Berlin","Rome"],a:1}]
};

function getQuestions(subject){
 let cls = localStorage.getItem('studentClass') || 'Primary 5';
 let bankForClass = BANK[cls];
 if(bankForClass && bankForClass[subject] && bankForClass[subject].length>=1){
   let qs = bankForClass[subject];
   while(qs.length<25){ qs = qs.concat(bankForClass[subject]); }
   return qs.slice(0,25);
 }
 return DEFAULT_Q[subject];
}

let currentSubject="",currentQ=0,score=0,wrongList=[],answered=false;
function openClassModal(){document.getElementById('modalTitle').innerText='Switch Class ';document.getElementById('classModal').style.display='flex';}
function saveClass(){
 const name=document.getElementById('studentName').value.trim();
 const cls=document.getElementById('studentClass').value;
 if(!name||!cls){alert('Enter name and class');return;}
 localStorage.setItem('studentName',name);localStorage.setItem('studentClass',cls);
 document.getElementById('classModal').style.display='none';updateHome();
}
function updateHome(){
 const name=localStorage.getItem('studentName')||'';const cls=localStorage.getItem('studentClass')||'';
 if(!name||!cls){openClassModal();return;}
 document.getElementById('greet').innerText=`Hello, ${name}!`;
 document.getElementById('currentClassBadge').innerText=cls;
 document.getElementById('classLabel').innerText=cls;
 let scores=JSON.parse(localStorage.getItem('scores_'+cls)||'{"English":0,"Mathematics":0,"Science":0,"General Knowledge":0}');
 let total=0;Object.values(scores).forEach(v=>total+=v);
 document.getElementById('totalScore').innerText=total;
 document.getElementById('avgScore').innerText=Math.round((total/100)*100)+'%';
 ['English','Mathematics','Science','General Knowledge'].forEach(s=>{
   let pct=Math.round((scores[s]/25)*100)||0;
   let el=document.getElementById('prog-'+s);
   if(el) el.innerText=pct+'% Done';
 });
}
function startQuiz(sub){
 currentSubject=sub;currentQ=0;score=0;wrongList=[];answered=false;
 document.getElementById('homeScreen').classList.add('hidden');
 document.getElementById('resultScreen').classList.add('hidden');
 document.getElementById('quizScreen').classList.remove('hidden');
 showQuestion();
}
function showQuestion(){
 answered=false;
 let qs=getQuestions(currentSubject);
 let q=qs[currentQ];
 document.getElementById('quizTitle').innerText=`${currentSubject} (${localStorage.getItem('studentClass')}) - Q${currentQ+1}/25`;
 document.getElementById('qProgress').style.width=((currentQ+1)/25*100)+'%';
 document.getElementById('questionText').innerText=q.q;
 let html='';q.o.forEach((opt,i)=>{html+=`<div class="option" onclick="selectOption(${i})" id="opt${i}">${opt}</div>`;});
 document.getElementById('options').innerHTML=html;
 document.getElementById('nextBtn').classList.add('hidden');
 document.getElementById('finishBtn').classList.add('hidden');
}
function selectOption(idx){
 if(answered) return;answered=true;
 let qs=getQuestions(currentSubject);let q=qs[currentQ];
 document.querySelectorAll('.option').forEach(o=>o.classList.remove('selected'));
 document.getElementById('opt'+idx).classList.add('selected');
 setTimeout(()=>{
   if(idx===q.a){document.getElementById('opt'+idx).classList.add('correct');score++;}else{document.getElementById('opt'+idx).classList.add('wrong');document.getElementById('opt'+q.a).classList.add('correct');wrongList.push({q:q.q,your:q.o[idx],correct:q.o[q.a]});}
   if(currentQ<24) document.getElementById('nextBtn').classList.remove('hidden'); else document.getElementById('finishBtn').classList.remove('hidden');
 },250);
}
function nextQuestion(){currentQ++;showQuestion();}
function finishQuiz(){
 let cls=localStorage.getItem('studentClass');
 let scores=JSON.parse(localStorage.getItem('scores_'+cls)||'{"English":0,"Mathematics":0,"Science":0,"General Knowledge":0}');
 scores[currentSubject]=score;localStorage.setItem('scores_'+cls,JSON.stringify(scores));
 document.getElementById('quizScreen').classList.add('hidden');
 document.getElementById('resultScreen').classList.remove('hidden');
 document.getElementById('reviewCard').classList.add('hidden');
 document.getElementById('rScore').innerText=score+'/25';
 document.getElementById('rPercent').innerText=Math.round(score/25*100)+'%';
 document.getElementById('rWrong').innerText=wrongList.length;
 document.getElementById('resultText').innerText=`${currentSubject} for ${cls} completed! You scored ${score}/25`;
 document.getElementById('reviewBtn').classList.toggle('hidden',wrongList.length===0);
}
function reviewWrong(){
 let html='';if(wrongList.length===0) html='<p>No wrong answers!</p>';else wrongList.forEach((w,i)=>{html+=`<div style="border:1px solid #ddd;border-radius:10px;padding:10px;margin:8px 0"><b>${i+1}. ${w.q}</b><br><span style="color:red">Your answer: ${w.your}</span><br><span style="color:green">Correct: ${w.correct}</span></div>`;});
 document.getElementById('reviewList').innerHTML=html;
 document.getElementById('reviewCard').classList.remove('hidden');
}
function goHome(){
 document.getElementById('quizScreen').classList.add('hidden');
 document.getElementById('resultScreen').classList.add('hidden');
 document.getElementById('homeScreen').classList.remove('hidden');
 updateHome();
}
(function(){let n=localStorage.getItem('studentName');let c=localStorage.getItem('studentClass');if(!n||!c){document.getElementById('classModal').style.display='flex';}else{updateHome();}})();
</script></body></html>
