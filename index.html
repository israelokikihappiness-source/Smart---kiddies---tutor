

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Kiddies Tutor</title>
<style>
*{box-sizing:border-box;font-family:system-ui, -apple-system}body{margin:0;background:#f2f4f7;min-height:100vh}
.header{background:white;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.08);position:sticky;top:0;z-index:10}
.logo{font-weight:800;color:#5a00d0;font-size:20px}
.main{max-width:520px;margin:0 auto;padding:12px}
.card{background:white;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.btn{border:none;padding:12px 20px;border-radius:20px;font-weight:700;cursor:pointer;font-size:15px}
.btn-green{background:#00c853;color:white}.btn-orange{background:#ff6f00;color:white}.btn-purple{background:#6a11cb;color:white;width:100%;padding:14px;border-radius:12px;font-size:17px}
.subject{border:2px solid #e5e7eb;border-radius:16px;padding:16px;margin:10px 0;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;background:white}
.progress{height:8px;background:#eee;border-radius:10px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,#00c853,#00e676);transition:.4s}
.q-card{border-left:5px solid #ddd;border-radius:12px;padding:12px;margin:10px 0;background:#fff9f9}
.q-card.correct{border-left-color:#00c853;background:#f0fff4}.q-card.wrong{border-left-color:#ff5252;background:#fff5f5}
.option{border:2px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;background:white}
.option.sel{border-color:#6a11cb;background:#f3e8ff}.option.ok{border-color:#00c853;background:#d4ffd4}.option.bad{border-color:#ff5252;background:#ffd4d4}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-box{background:white;border-radius:20px;padding:20px;width:100%;max-width:400px}
input,select{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;margin:6px 0;font-size:16px}
.hidden{display:none}
</style></head><body>
<div class="header"><div class="logo">Smart Kiddies Tutor</div><div id="topClass" style="background:#ede7ff;color:#5a00d0;padding:6px 12px;border-radius:20px;font-weight:700;font-size:13px">-</div></div>
<div class="main">
<div id="classModal" class="modal"><div class="modal-box"><h2>Welcome! </h2><p>Enter name and class</p><input id="sName" placeholder="Your Name"><select id="sClass"><option value="">-- Select Class --</option><option>Nursery 1</option><option>Nursery 2</option><option>Primary 1</option><option>Primary 2</option><option>Primary 3</option><option>Primary 4</option><option>Primary 5</option><option>Primary 6</option></select><button class="btn btn-purple" onclick="saveC()">Start </button></div></div>

<div id="home"><div class="card"><h2 id="greet">Hello!</h2><p>Select subject to practice</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div style="background:#e8f5e9;border-radius:12px;padding:12px;text-align:center"><b id="tScore">0</b><br>Score</div><div style="background:#e3f2fd;border-radius:12px;padding:12px;text-align:center"><b id="tAvg">0%</b><br>Avg</div></div><button class="btn btn-orange" style="width:100%;margin-top:12px" onclick="openM()"> Change Class</button></div>
<div class="card"><h3>Assessment - 45 Questions for <span id="cLabel">-</span></h3>
<div class="subject" onclick="startQ('Quantitative')"><span> Quantitative Reasoning</span><span id="p-Quantitative">0%</span></div>
<div class="subject" onclick="startQ('Verbal')"><span> Verbal Reasoning</span><span id="p-Verbal">0%</span></div>
</div></div>

<div id="quiz" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between"><b id="qTitle">Q1/45</b><b id="qCount">1/45</b></div><div class="progress"><div id="qBar" class="progress-fill" style="width:2%"></div></div><p id="qText" style="font-size:18px;font-weight:700"></p><div id="opts"></div><button id="nBtn" class="btn btn-purple hidden" style="width:100%;margin-top:10px" onclick="nextQ()">Next →</button><button id="fBtn" class="btn btn-green hidden" style="width:100%;margin-top:10px" onclick="finishQ()">Finish</button></div></div>

<div id="result" class="hidden"><div class="card" style="text-align:center"><h2 id="rHead">Good Job Joy!</h2><div id="rPerc" style="font-size:42px;font-weight:900;color:#ff6f00">53% (24/45)</div><p id="rSub" style="color:#666">Primary 1 - verbal - assessment</p><div style="display:flex;gap:10px;justify-content:center;margin:12px 0"><button class="btn btn-green" onclick="goHome()">Dashboard</button><button class="btn btn-orange" onclick="startQ(currentSub)">Practice</button></div><h3 style="text-align:left">Review All Questions</h3><div id="reviewList"></div></div></div>
</div>

<script>
const Q={
"Quantitative":[
{q:"What is next? 2,4,6,8,__?",o:["9","10","11","12"],a:1,e:"Even numbers add 2"},
{q:"Half of 20?",o:["5","10","15","20"],a:1,e:"20/2=10"},
{q:"5+7=?",o:["10","11","12","13"],a:2,e:"5+7=12"},
{q:"Which is bigger? 15 or 9",o:["15","9","Equal","None"],a:0,e:"15 > 9"},
{q:"Count: 1,2,3,?,5",o:["3","4","6","7"],a:1,e:"Missing 4"},
{q:"7+3=?",o:["9","10","11","12"],a:1,e:"7+3=10"},
{q:"20-5=?",o:["10","15","20","25"],a:1,e:"20-5=15"},
{q:"3 x 4=?",o:["7","12","9","8"],a:1,e:"3x4=12"},
{q:"9-3=?",o:["3","6","9","12"],a:1,e:"9-3=6"},
{q:"10/2=?",o:["2","5","10","20"],a:1,e:"10/2=5"},
{q:"2,4,6,8,10 is?",o:["Odd","Even","Prime","None"],a:1,e:"All even"},
{q:"15-7=?",o:["7","8","9","10"],a:1,e:"15-7=8"},
{q:"6x2=?",o:["10","12","14","16"],a:1,e:"6x2=12"},
{q:"What comes after 99?",o:["100","99","98","101"],a:0,e:"Next is 100"},
{q:"25+25=?",o:["40","50","60","70"],a:1,e:"25+25=50"}
],
"Verbal":[
{q:"Opposite of BIG?",o:["Large","Small","Huge","Big"],a:1,e:"Big and small are opposites"},
{q:"Cat:kitten :: Dog:___",o:["Cub","Puppy","Calf","Kit"],a:1,e:"Baby dog = puppy"},
{q:"After B?",o:["A","C","D","E"],a:1,e:"Alphabet: A B C"},
{q:"Odd: Apple,Banana,Car,Mango",o:["Apple","Banana","Car","Mango"],a:2,e:"Car is not fruit"},
{q:"I ___ a book yesterday",o:["reading","read","reads","readed"],a:1,e:"Yesterday = past"},
{q:"A is to Apple, B is to?",o:["Ball","Cat","Dog","Egg"],a:0,e:"B for Ball"},
{q:"Plural of Boy?",o:["Boys","Boyes","Boyses","Boy"],a:0,e:"Add s"},
{q:"Opposite of Happy?",o:["Sad","Big","Tall","Fast"],a:0,e:"Happy vs Sad"},
{q:"We ___ to school",o:["go","goes","going","gone"],a:0,e:"We go"},
{q:"Correct: Beautiful",o:["Beutiful","Beautiful","Beatiful","Beautifull"],a:1,e:"Spelling"},
{q:"I ___ a student",o:["am","is","are","be"],a:0,e:"I am"},
{q:"She ___ singing",o:["is","am","are","be"],a:0,e:"She is"},
{q:"Synonym of Big?",o:["Small","Large","Tiny","Little"],a:1,e:"Big=Large"},
{q:"Antonym of Hot?",o:["Cold","Warm","Heat","Boil"],a:0,e:"Hot vs Cold"},
{q:"He, She, It are?",o:["Nouns","Pronouns","Verbs","Adjectives"],a:1,e:"Pronouns"}
]
};

function fill45(arr){let out=[...arr];while(out.length<45){out=out.concat(arr);}return out.slice(0,45);}

const BANK={};
["Nursery 1","Nursery 2","Primary 1","Primary 2","Primary 3","Primary 4","Primary 5","Primary 6"].forEach(c=>{
 BANK[c]={Quantitative:fill45(Q.Quantitative),Verbal:fill45(Q.Verbal)};
});

let currentSub="",currentQ=0,score=0,answers=[],answered=false;
function openM(){document.getElementById('classModal').style.display='flex';}
function saveC(){
 let n=document.getElementById('sName').value.trim();let cl=document.getElementById('sClass').value;
 if(!n||!cl){alert('Enter name and class');return;}
 localStorage.setItem('sName',n);localStorage.setItem('sClass',cl);
 document.getElementById('classModal').style.display='none';updHome();
}
function updHome(){
 let n=localStorage.getItem('sName')||'';let c=localStorage.getItem('sClass')||'';
 if(!n||!c){openM();return;}
 document.getElementById('greet').innerText=`Hello ${n}!`;document.getElementById('topClass').innerText=c;document.getElementById('cLabel').innerText=c;
 let sc=JSON.parse(localStorage.getItem('sc_'+c)||'{"Quantitative":0,"Verbal":0}');
 document.getElementById('tScore').innerText=(sc.Quantitative+sc.Verbal);document.getElementById('tAvg').innerText=Math.round((sc.Quantitative+sc.Verbal)/90*100)+'%';
 ['Quantitative','Verbal'].forEach(s=>{let pct=Math.round((sc[s]/45)*100)||0;document.getElementById('p-'+s).innerText=pct+'%';});
}
function startQ(sub){
 currentSub=sub;currentQ=0;score=0;answers=[];answered=false;
 document.getElementById('home').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');
 showQ();
}
function showQ(){
 answered=false;let qs=BANK[localStorage.getItem('sClass')][currentSub];let q=qs[currentQ];
 document.getElementById('qTitle').innerText=`${currentSub} - Q${currentQ+1}/45`;document.getElementById('qCount').innerText=`${currentQ+1}/45`;
 document.getElementById('qBar').style.width=((currentQ+1)/45*100)+'%';document.getElementById('qText').innerText=`${currentQ+1}. ${q.q}`;
 let html='';q.o.forEach((op,i)=>{html+=`<div class="option" id="op${i}" onclick="pick(${i})">${op}</div>`;});document.getElementById('opts').innerHTML=html;
 document.getElementById('nBtn').classList.add('hidden');document.getElementById('fBtn').classList.add('hidden');
}
function pick(i){
 if(answered)return;answered=true;let qs=BANK[localStorage.getItem('sClass')][currentSub];let q=qs[currentQ];
 document.querySelectorAll('.option').forEach(o=>o.classList.remove('sel'));document.getElementById('op'+i).classList.add('sel');
 setTimeout(()=>{
   if(i===q.a){document.getElementById('op'+i).classList.add('ok');score++;answers.push({q:q.q,you:q.o[i],correct:q.o[q.a],ok:true,exp:q.e});}
   else{document.getElementById('op'+i).classList.add('bad');document.getElementById('op'+q.a).classList.add('ok');answers.push({q:q.q,you:q.o[i],correct:q.o[q.a],ok:false,exp:q.e});}
   if(currentQ<44)document.getElementById('nBtn').classList.remove('hidden');else document.getElementById('fBtn').classList.remove('hidden');
 },200);
}
function nextQ(){currentQ++;showQ();}
function finishQ(){
 let c=localStorage.getItem('sClass');let sc=JSON.parse(localStorage.getItem('sc_'+c)||'{"Quantitative":0,"Verbal":0}');sc[currentSub]=score;localStorage.setItem('sc_'+c,JSON.stringify(sc));
 document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');
 let n=localStorage.getItem('sName')||'Joy';let perc=Math.round(score/45*100);
 document.getElementById('rHead').innerText=`Good Job ${n}!`;document.getElementById('rPerc').innerText=`${perc}% (${score}/45)`;document.getElementById('rSub').innerText=`${c} - ${currentSub.toLowerCase()} - assessment`;
 let html='';answers.forEach((a,idx)=>{
   html+=`<div class="q-card ${a.ok?'correct':'wrong'}"><b>${idx+1}. ${a.q}</b><br>You: ${a.you}<br>Correct: ${a.correct}<br><i>${a.exp}</i></div>`;
 });
 document.getElementById('reviewList').innerHTML=html;
}
function goHome(){document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('home').classList.remove('hidden');updHome();}
(function(){let n=localStorage.getItem('sName');let c=localStorage.getItem('sClass');if(!n||!c)openM();else updHome();})();
</script></body></html>
